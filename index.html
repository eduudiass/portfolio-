<style>
  :root {
    --paper: #f6f2e9; --paper-2: #efe9dc; --ink: #1a1d24; --ink-soft: #4a4f5c;
    --line: #d8d0bf; --accent: #1f6b46; --accent-soft: #2c8a5c; --accent-wash: rgba(31,107,70,0.08);
    --serif: "Fraunces", Georgia, serif; --sans: "Hanken Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--paper);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px; background-position: -1px -1px;
    color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; position: relative;
  }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse 120% 80% at 50% -10%, transparent 40%, rgba(246,242,233,0.7) 100%); pointer-events: none; z-index: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }

  nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(8px); background: rgba(246,242,233,0.82); border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { font-family: var(--mono); font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
  .brand span { color: var(--accent); }
  .nav-group { display: flex; align-items: center; gap: 26px; }
  .nav-links { display: flex; gap: 26px; font-family: var(--mono); font-size: 13px; }
  .nav-links a { color: var(--ink-soft); transition: color 0.2s; position: relative; }
  .nav-links a:hover, .nav-links a.active { color: var(--ink); }
  .nav-links a.active::after { content: ""; position: absolute; left: 0; bottom: -22px; width: 100%; height: 2px; background: var(--accent); }
  .lang-toggle { display: flex; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang-toggle button { background: transparent; border: none; padding: 6px 11px; cursor: pointer; color: var(--ink-soft); font-family: inherit; font-size: inherit; transition: background 0.2s, color 0.2s; }
  .lang-toggle button.active { background: var(--accent); color: #fff; }
  .nav-toggle { display: none; font-family: var(--mono); font-size: 13px; background: none; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; color: var(--ink); border-radius: 4px; }

  header.hero { padding: 92px 0 76px; position: relative; overflow: hidden; }
  .eyebrow { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 22px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(48px, 8vw, 92px); line-height: 0.98; letter-spacing: -0.02em; margin-bottom: 26px; }
  h1 em { font-style: italic; color: var(--accent); }
  .hero-role { font-size: clamp(18px, 2.4vw, 22px); color: var(--ink-soft); max-width: 560px; line-height: 1.5; }
  .hero-role b { color: var(--ink); font-weight: 600; }
  .hero-cta { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }
  .btn { font-family: var(--mono); font-size: 14px; padding: 13px 22px; border-radius: 6px; cursor: pointer; transition: transform 0.15s, background 0.2s; display: inline-flex; align-items: center; gap: 9px; }
  .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .btn-primary:hover { background: var(--accent-soft); transform: translateY(-2px); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); transform: translateY(-2px); }
  .sparkline { position: absolute; right: -40px; top: 70px; width: 380px; max-width: 42vw; opacity: 0.5; pointer-events: none; }

  section { padding: 72px 0; border-top: 1px solid var(--line); }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 44px; }
  .sec-num { font-family: var(--mono); font-size: 14px; color: var(--accent); }
  .sec-title { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 4.5vw, 44px); letter-spacing: -0.01em; }

  .about-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: start; }
  .about-text p { margin-bottom: 18px; max-width: 56ch; }
  .about-text p:last-child { margin-bottom: 0; }
  .about-side { border-left: 2px solid var(--accent); padding-left: 22px; }
  .fact { margin-bottom: 22px; }
  .fact-label { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 4px; }
  .fact-value { font-family: var(--serif); font-size: 19px; }

  .filters { display: flex; gap: 10px; margin-bottom: 34px; flex-wrap: wrap; }
  .filter-btn { font-family: var(--mono); font-size: 13px; padding: 8px 16px; border: 1px solid var(--line); background: transparent; border-radius: 999px; cursor: pointer; color: var(--ink-soft); transition: all 0.18s; }
  .filter-btn:hover { border-color: var(--ink); color: var(--ink); }
  .filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(26,29,36,0.10); border-color: var(--accent); }
  .card-type { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 12px; }
  .card h3 { font-family: var(--serif); font-weight: 500; font-size: 23px; line-height: 1.15; margin-bottom: 12px; }
  .card p { font-size: 15px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 18px; flex-grow: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
  .tag { font-family: var(--mono); font-size: 11.5px; background: var(--accent-wash); color: var(--accent); padding: 4px 9px; border-radius: 4px; }
  .card-links { display: flex; gap: 18px; font-family: var(--mono); font-size: 13px; }
  .card-links a { color: var(--ink); border-bottom: 1px solid var(--accent); padding-bottom: 1px; transition: color 0.2s; }
  .card-links a:hover { color: var(--accent); }

  .ticker { overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 46px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
  .ticker-track { display: flex; width: max-content; animation: scroll-x 30s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ti { font-family: var(--mono); font-size: 14px; color: var(--ink-soft); white-space: nowrap; display: inline-flex; align-items: center; }
  .ti::before { content: "/"; color: var(--accent); margin: 0 22px; font-weight: 600; }
  @keyframes scroll-x { to { transform: translateX(-50%); } }
  .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px 56px; }
  .skill-group h4 { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .skill-list { display: flex; flex-wrap: wrap; gap: 9px; }
  .skill-pill { font-family: var(--sans); font-size: 14px; font-weight: 500; padding: 7px 14px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; cursor: default; opacity: 0; transform: translateY(12px) scale(0.96); transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s; }
  .skill-group.in .skill-pill { animation: pop 0.5s var(--d, 0s) both; }
  .skill-pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: translateY(-3px); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .contact-flex { display: flex; flex-direction: column; gap: 28px; max-width: 640px; }
  .contact-lead { font-family: var(--serif); font-size: clamp(22px, 3.2vw, 30px); line-height: 1.3; }
  .contact-links { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line); }
  .contact-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px; border-bottom: 1px solid var(--line); transition: padding-left 0.2s, background 0.2s; }
  .contact-row:hover { padding-left: 14px; background: var(--accent-wash); }
  .contact-row .label { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
  .contact-row .value { font-family: var(--serif); font-size: 19px; }
  .contact-row .arrow { font-family: var(--mono); color: var(--accent); }

  footer { padding: 40px 0 60px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
  footer .wrap { display: flex; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 12px; }

  .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  .h-1 { animation: rise 0.8s 0.05s both; } .h-2 { animation: rise 0.8s 0.18s both; }
  .h-3 { animation: rise 0.8s 0.31s both; } .h-4 { animation: rise 0.8s 0.44s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  @media (max-width: 820px) {
    .about-grid { grid-template-columns: 1fr; gap: 36px; }
    .projects { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr; gap: 32px; }
    .nav-links { display: none; }
    .nav-links.open { display: flex; position: absolute; top: 64px; left: 0; right: 0; flex-direction: column; background: var(--paper); border-bottom: 1px solid var(--line); padding: 20px 28px; gap: 18px; }
    .nav-links.open a.active::after { display: none; }
    .nav-toggle { display: block; }
    .sparkline { display: none; }
  }
</style>

<body>

<script>
/* =========================================================
   CONFIGURAÇÃO. Edite tudo a partir daqui.
   Cada texto tem versão pt e en. Para adicionar projeto,
   copie um objeto dentro de PROJECTS (com titulo/descricao nos dois idiomas).
   ========================================================= */

const CONFIG = {
  cvUrl: "cv.pdf",  // troque por um link do Drive se preferir
  contact: [
    { label: "LinkedIn", value: "in/eduardodiasds", url: "https://www.linkedin.com/in/eduardodiasds/" },
    { label: "GitHub", value: "eduudiass", url: "https://github.com/eduudiass" },
    { label: "Email", value: "eduardomachadodiasfilho7@gmail.com", url: "mailto:eduardomachadodiasfilho7@gmail.com" }
  ]
};

/* Textos por idioma */
const T = {
  pt: {
    nav: ["sobre", "projetos", "habilidades", "contato"],
    sec: ["Sobre", "Projetos", "Habilidades", "Contato"],
    eyebrow: "Cientista de Dados em formação",
    heroRole: "Estudante de <b>Ciência de Dados e IA</b> na PUCRS, construindo carreira em <b>Machine Learning</b> e análise de dados com foco no setor financeiro.",
    ctaContact: "Entrar em contato",
    ctaCV: "Baixar CV",
    about: [
      "Sou estudante de Ciência de Dados e Inteligência Artificial na PUCRS, em Porto Alegre. Meu foco é construir soluções de dados aplicadas a negócio, com interesse particular pelo setor financeiro e por Machine Learning.",
      "Na prática, trabalho com Python, SQL e Power BI para transformar dados brutos em decisão. Mantenho sistemas de dados reais, incluindo o controle de frota do negócio da minha família, e desenvolvo projetos de portfólio que vão de análise exploratória a modelos preditivos.",
      "Estou em evolução constante, estudando estatística, modelagem e o mercado financeiro para chegar onde quero: atuar como Cientista de Dados voltado a Machine Learning."
    ],
    facts: [
      { label: "Formação", value: "Ciência de Dados e IA, PUCRS" },
      { label: "Localização", value: "Porto Alegre, RS" },
      { label: "Foco", value: "Machine Learning e setor financeiro" },
      { label: "Stack base", value: "Python, SQL, Power BI" }
    ],
    contactLead: "Aberto a oportunidades de estágio e projetos em dados, analytics e Machine Learning.",
    footerLoc: "Eduardo Dias, Porto Alegre, RS"
  },
  en: {
    nav: ["about", "projects", "skills", "contact"],
    sec: ["About", "Projects", "Skills", "Contact"],
    eyebrow: "Data Scientist in training",
    heroRole: "Data Science and AI student at PUCRS, building a career in <b>Machine Learning</b> and data analytics with a focus on the financial sector.",
    ctaContact: "Get in touch",
    ctaCV: "Download CV",
    about: [
      "I am a Data Science and AI student at PUCRS, in Porto Alegre, Brazil. My focus is building data solutions applied to business, with a particular interest in the financial sector and Machine Learning.",
      "In practice, I work with Python, SQL and Power BI to turn raw data into decisions. I maintain real data systems, including the fleet control for my family's business, and develop portfolio projects ranging from exploratory analysis to predictive models.",
      "I am constantly evolving, studying statistics, modeling and the financial market to reach my goal: working as a Data Scientist focused on Machine Learning."
    ],
    facts: [
      { label: "Education", value: "Data Science and AI, PUCRS" },
      { label: "Location", value: "Porto Alegre, Brazil" },
      { label: "Focus", value: "Machine Learning and finance" },
      { label: "Core stack", value: "Python, SQL, Power BI" }
    ],
    contactLead: "Open to internship opportunities and projects in data, analytics and Machine Learning.",
    footerLoc: "Eduardo Dias, Porto Alegre, Brazil"
  }
};

/* Filtros: key interna + rótulo por idioma. O primeiro é o estado inicial. */
const FILTERS = [
  { key: "all",  pt: "Todos",       en: "All" },
  { key: "data", pt: "Dados e BI",  en: "Data & BI" },
  { key: "app",  pt: "Aplicações",  en: "Applications" },
  { key: "acad", pt: "Acadêmicos",  en: "Academic" }
];

/* Rótulo do tipo mostrado no card, por idioma */
const TIPO_LABEL = {
  data: { pt: "Dados e BI", en: "Data & BI" },
  app:  { pt: "Aplicações", en: "Applications" },
  acad: { pt: "Acadêmico",  en: "Academic" }
};

/* PROJETOS. tipo é a key (data/app/acad). titulo e descricao nos dois idiomas. */
const PROJECTS = [
  {
    tipo: "app",
    titulo: { pt: "Data Detective", en: "Data Detective" },
    descricao: {
      pt: "Jogo educacional de SQL onde o jogador resolve casos escrevendo consultas reais. Projeto em equipe, com editor de código integrado e correção automática das queries.",
      en: "Educational SQL game where the player solves cases by writing real queries. Team project, with an integrated code editor and automatic query checking."
    },
    tags: ["React", "Next.js", "Node.js", "SQLite", "Monaco Editor"],
    repo: "https://github.com/lucasnk1/Data-Detective", demo: ""
  },
  {
    tipo: "app",
    titulo: { pt: "Dashboard de Gestão de Frota", en: "Fleet Management Dashboard" },
    descricao: {
      pt: "Sistema de monitoramento de frota de 12 veículos, com KPIs de receita, ocupação e manutenção. Extração de dados via Python e publicação no GitHub Pages. Em uso real no negócio da família.",
      en: "Monitoring system for a fleet of 12 vehicles, with KPIs for revenue, occupancy and maintenance. Data extraction via Python and published on GitHub Pages. In real use at the family business."
    },
    tags: ["Python", "openpyxl", "JavaScript", "Chart.js", "HTML/CSS"],
    repo: "https://github.com/eduudiass/dashboard-frota-eduardo", demo: ""
  },
  {
    tipo: "data",
    titulo: { pt: "Dashboard de RH", en: "HR Dashboard" },
    descricao: {
      pt: "Dashboard interativo de RH cobrindo turnover, absenteísmo, admissões, desligamentos e diversidade, com base no dataset IBM HR Analytics.",
      en: "Interactive HR dashboard covering turnover, absenteeism, hires, terminations and diversity, based on the IBM HR Analytics dataset."
    },
    tags: ["Python", "Streamlit", "Pandas"],
    repo: "https://github.com/eduudiass/dashboard-rh", demo: ""
  },
  {
    tipo: "data",
    titulo: { pt: "Análise de Gols em Copas do Mundo", en: "World Cup Goal Analysis" },
    descricao: {
      pt: "Análise de gols em Copas do Mundo da FIFA, com visualizações interativas por edição, fase, minuto de jogo, país e artilheiros históricos.",
      en: "Analysis of goals in FIFA World Cups, with interactive visualizations by edition, stage, match minute, country and all-time top scorers."
    },
    tags: ["HTML", "CSS", "JavaScript", "Chart.js"],
    repo: "https://github.com/eduudiass/copa-do-mundo-dashboard", demo: ""
  },
  {
    tipo: "data",
    titulo: { pt: "Análise de GreNais", en: "GreNal Derby Analysis" },
    descricao: {
      pt: "Painel de análise dos clássicos GreNal, explorando histórico de confrontos e estatísticas das partidas entre Grêmio e Internacional.",
      en: "Analysis panel of the GreNal derby, exploring head to head history and match statistics between Grêmio and Internacional."
    },
    tags: ["HTML", "CSS", "JavaScript", "Chart.js"],
    repo: "https://github.com/eduudiass/grenais-dashboard", demo: ""
  }
];

/* HABILIDADES. grupo nos dois idiomas, itens compartilhados. */
const SKILLS = [
  { grupo: { pt: "Linguagens", en: "Languages" }, itens: ["Python", "SQL", "MySQL", "R"] },
  { grupo: { pt: "Análise e BI", en: "Analysis & BI" }, itens: ["Power BI", "Pandas", "NumPy", "Matplotlib", "Seaborn", "Excel"] },
  { grupo: { pt: "Machine Learning", en: "Machine Learning" }, itens: ["Scikit-learn", "TensorFlow", "Keras", "Visão Computacional"] },
  { grupo: { pt: "Ferramentas", en: "Tools" }, itens: ["Git", "GitHub", "Google Colab", "VS Code"] }
];

/* =========================================================
   RENDER. Não precisa editar daqui para baixo.
   ========================================================= */

let lang = "pt";
try { const saved = localStorage.getItem("lang"); if (saved === "pt" || saved === "en") lang = saved; } catch (e) {}

document.getElementById("cvBtn").href = CONFIG.cvUrl;
document.getElementById("year").textContent = "\u00A9 " + new Date().getFullYear() + " Eduardo Dias";

// ticker e skills (independentes de idioma para itens, mas grupo muda)
const allSkills = SKILLS.flatMap(s => s.itens);
const tickerHTML = allSkills.map(s => '<span class="ti">' + s + '</span>').join("");
document.getElementById("tickerTrack").innerHTML = tickerHTML + tickerHTML;

function renderContacts() {
  document.getElementById("contactLinks").innerHTML = CONFIG.contact.map(c =>
    '<a class="contact-row" href="' + c.url + '" target="_blank" rel="noopener">' +
    '<span class="label">' + c.label + '</span><span class="value">' + c.value + '</span>' +
    '<span class="arrow">-&gt;</span></a>'
  ).join("");
}

function renderSkills() {
  document.getElementById("skills").innerHTML = SKILLS.map(s =>
    '<div class="skill-group"><h4>' + s.grupo[lang] + '</h4><div class="skill-list">' +
    s.itens.map((i, idx) => '<span class="skill-pill" style="--d:' + (idx * 0.05) + 's">' + i + '</span>').join("") +
    '</div></div>'
  ).join("");
  document.querySelectorAll(".skill-group").forEach(el => { el.classList.add("in"); });
}

function cardHTML(p) {
  const tags = p.tags.map(t => '<span class="tag">' + t + '</span>').join("");
  let links = "";
  if (p.repo) links += '<a href="' + p.repo + '" target="_blank" rel="noopener">' + (lang === "pt" ? "Repositório" : "Repository") + '</a>';
  if (p.demo) links += '<a href="' + p.demo + '" target="_blank" rel="noopener">' + (lang === "pt" ? "Ver online" : "Live demo") + '</a>';
  return '<article class="card">' +
    '<div class="card-type">' + TIPO_LABEL[p.tipo][lang] + '</div>' +
    '<h3>' + p.titulo[lang] + '</h3>' +
    '<p>' + p.descricao[lang] + '</p>' +
    '<div class="tags">' + tags + '</div>' +
    '<div class="card-links">' + links + '</div></article>';
}

let activeFilter = "all";
const projectsEl = document.getElementById("projects");
function renderProjects() {
  const list = (activeFilter === "all") ? PROJECTS : PROJECTS.filter(p => p.tipo === activeFilter);
  projectsEl.innerHTML = list.map(cardHTML).join("");
}

const filtersEl = document.getElementById("filters");
function renderFilters() {
  filtersEl.innerHTML = FILTERS.map(f =>
    '<button class="filter-btn' + (f.key === activeFilter ? ' active' : '') + '" data-f="' + f.key + '">' + f[lang] + '</button>'
  ).join("");
}
filtersEl.addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  activeFilter = btn.dataset.f;
  renderFilters();
  renderProjects();
});

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = (lang === "pt") ? "pt-BR" : "en";
  document.querySelectorAll("[data-nav]").forEach(a => a.textContent = t.nav[+a.dataset.nav]);
  document.querySelectorAll("[data-sec]").forEach(h => h.textContent = t.sec[+h.dataset.sec]);
  document.getElementById("eyebrow").textContent = t.eyebrow;
  document.getElementById("heroRole").innerHTML = t.heroRole;
  document.getElementById("ctaContact").textContent = t.ctaContact;
  document.getElementById("cvBtn").textContent = t.ctaCV;
  document.getElementById("aboutText").innerHTML = t.about.map(p => "<p>" + p + "</p>").join("");
  document.getElementById("aboutFacts").innerHTML = t.facts.map(f =>
    '<div class="fact"><div class="fact-label">' + f.label + '</div><div class="fact-value">' + f.value + '</div></div>'
  ).join("");
  document.getElementById("contactLead").textContent = t.contactLead;
  document.getElementById("footerLoc").textContent = t.footerLoc;
  renderFilters();
  renderProjects();
  renderSkills();
  renderContacts();
  document.querySelectorAll("#langToggle button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
}

document.getElementById("langToggle").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (err) {}
  applyLang();
});

applyLang();

const navLinks = document.getElementById("navLinks");
document.getElementById("navToggle").addEventListener("click", () => navLinks.classList.toggle("open"));
navLinks.addEventListener("click", e => { if (e.target.tagName === "A") navLinks.classList.remove("open"); });

const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

const sections = [...document.querySelectorAll("section[id]")];
const navAnchors = [...document.querySelectorAll(".nav-links a")];
window.addEventListener("scroll", () => {
  const y = window.scrollY + 90;
  let current = "";
  sections.forEach(s => { if (s.offsetTop <= y) current = s.id; });
  navAnchors.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + current));
});
</script>
